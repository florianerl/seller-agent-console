# Static hosting for the console. Everything here is something GitHub Pages
# cannot do, which is most of the reason to run this as a container at all.

# Cache policy is computed here rather than per location, because nginx's
# add_header does not merge: a single add_header inside a location block
# silently discards EVERY add_header inherited from the server block. Setting
# Cache-Control per location is what dropped the CSP from index.html, and the
# failure mode is a missing security header rather than an error.
map $uri $console_cache {
  # Hashed filenames are content-addressed, so they can be kept forever.
  "~^/assets/"  "public, max-age=31536000, immutable";
  # Everything else revalidates. index.html and sw.js are the two that gate an
  # update: Pages pins them to max-age=600 and cannot be told otherwise, which
  # is a ten-minute floor on update propagation. Here there is no floor.
  default       "no-cache, must-revalidate";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # One add_header block, at server level, applied to every response.
  add_header Cache-Control $console_cache always;
  # Real response headers, which a <meta> tag cannot express: frame-ancestors
  # and the reporting directives are silently ignored there.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location = /manifest.webmanifest {
    # nginx's bundled mime.types has no entry for .webmanifest, so it would go
    # out as application/octet-stream and the browser would ignore it — the app
    # silently stops being installable, with nothing logged to say why. An
    # empty `types` block plus `default_type` sets it for this one file without
    # replacing the inherited map, which a populated `types` block would do.
    # Neither directive is an add_header, so the headers above still apply.
    types { }
    default_type application/manifest+json;
  }

  # A missing asset is a 404, never a fallback to index.html. With hash routing
  # the origin is only ever asked for "/" and "/index.html", so a request for a
  # hashed chunk that is not there is a real failure — the symptom of an unsafe
  # worker update — and must not be answered with a 200.
  location / {
    try_files $uri $uri/ =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;
}
