# Static hosting for the console. Everything here is something GitHub Pages
# cannot do, which is most of the reason to run it as a container at all.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Pages serves everything max-age=600, which puts a ten-minute floor on
  # update propagation that cannot be lowered. Here the two files that gate an
  # update are explicitly never cached, so a deploy reaches an open tab as soon
  # as it checks.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Hashed filenames are content-addressed, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Real response headers, which a <meta> tag cannot express. frame-ancestors
  # and the reporting directives only work from here — the meta CSP in the page
  # silently ignores both.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # A missing asset is a 404, never a fallback to index.html. With hash routing
  # the origin is only ever asked for "/" and "/index.html", so a request for a
  # hashed chunk that is not there is a real failure — the symptom of an unsafe
  # worker update — and must not be answered with a 200.
  location / {
    try_files $uri $uri/ =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;
}
