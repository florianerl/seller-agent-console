name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      # Guards inspect dist/, so the build has to happen first. BASE_PATH is
      # not set here: the default in config/base-path.ts is what the guards
      # assert against, and CI must not diverge from it silently.
      - name: Build
        run: npm run build

      - name: Guards
        run: npm run test:guards
