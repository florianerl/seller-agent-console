name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Type-aware, and warnings fail: a warning nobody fails on is a comment.
      - name: Lint
        run: npm run lint

      # Shuffled so order dependence between tests surfaces here rather than
      # intermittently. Vitest prints the seed on failure for reproduction.
      - name: Unit and integration tests
        run: npx vitest run --project unit --sequence.shuffle

      # Guards inspect dist/, so the build has to happen first. BASE_PATH is
      # not set here: the default in config/base-path.ts is what the guards
      # assert against, and CI must not diverge from it silently.
      - name: Build
        run: npm run build

      - name: Guards
        run: npm run test:guards

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Serves dist/ under the real deploy prefix, never at the origin root:
      # base-path bugs resolve correctly at / and only break under a prefix,
      # which is exactly how they reach production unnoticed.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Against a local preview of this build, so a pull request is gated
      # before anything deploys.
      - name: Lighthouse budgets
        run: npm run test:lighthouse
